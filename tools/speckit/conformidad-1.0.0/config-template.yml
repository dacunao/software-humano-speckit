# Excepciones explícitas y aprobadas de este proyecto.
#
# La definición de terminado del manifiesto admite dos estados y no más: un
# elemento tiene implementación y evidencia verificable, **o** una excepción
# explícita y aprobada. Lo que no es ninguna de las dos cosas es incumplimiento.
#
# Este archivo es donde se declaran las del segundo tipo. Un repositorio que
# nació antes del manifiesto entra por aquí: declara lo que todavía no cumple,
# con su razón y quién la aprobó, y el método no lo bloquea. Lo que el método
# rechaza es lo que falta sin que nadie lo sepa.
#
# Cada excepción exige tres cosas. Sin las tres no es una excepción aprobada:
#   seccion  · qué comprobación no se satisface
#   razon    · por qué, en términos que otra persona pueda evaluar
#   aprobada_por · quién tiene autoridad para aprobarla

excepciones: []

# Ejemplo, para borrar:
#
# excepciones:
#   - seccion: "Presupuesto de complejidad"
#     razon: "El producto existía antes de adoptar el método; se levantará al planificar la próxima capacidad."
#     aprobada_por: "Nombre de la autoridad de producto"
#     desde: "2026-09-23"
