schema_version: "1.0"

bundle:
  id: "software-humano"
  name: "Software Humano"
  version: "2.0.0"
  role: "developer"
  description: "Instala el método que aplica el Manifiesto de Software Humano al ciclo SDD de SpecKit: la doctrina compilada en los artefactos, la comprobación de conformidad y las compuertas que el propio manifiesto especifica."
  author: "Damián Acuña"
  license: "MIT"

requires:
  # 1.0.0 es la primera versión donde la composición de comandos conserva el
  # frontmatter del core cuando la capa del preset no declara uno. De eso
  # dependen los handoffs, la descripción nativa y los scripts.
  speckit_version: ">=1.0.0,<2.0.0"

# Sin `integration`: el método no depende de un agente en particular. Vale para
# cualquiera que SpecKit soporte.

presets:
  - id: "software-humano"
    version: "2.0.0"
    source: "../software-humano-spec-kit-preset-2.0.0"
    priority: 10

extensions:
  - id: "conformidad"
    version: "2.0.0"
    source: "../conformidad-1.0.0"

workflows:
  - id: "software-humano"
    version: "2.0.0"
    source: "../workflow-software-humano-1.0.0"

tags:
  - "human-centered"
  - "jobs-to-be-done"
  - "job-stories"
  - "product-governance"
  - "sdd"
