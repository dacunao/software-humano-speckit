schema_version: "1.0"

preset:
  id: "software-humano"
  name: "Software Humano"
  version: "1.0.0"
  description: "Aplica el Manifiesto de Software Humano al ciclo SDD nativo de SpecKit sin agregar etapas ni artefactos metodológicos."
  author: "Damián Acuña"
  license: "Proprietary"

requires:
  speckit_version: ">=1.0.0,<2.0.0"

provides:
  templates:
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "Proyección operativa completa del núcleo v2.1"
      replaces: "constitution-template"

    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Especificación adaptable a fundamentos de producto heterogéneos"
      replaces: "spec-template"

    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Plan de cobertura completa ordenado por dependencias"
      replaces: "plan-template"

    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Tareas trazables sin imponer prioridad, MVP ni independencia"
      replaces: "tasks-template"

    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      description: "Protege la versión aprobada del núcleo durante su materialización"
      strategy: "wrap"

    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Preserva fuente, autoridad y cobertura completa al especificar"
      strategy: "wrap"

    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Resuelve ambigüedades materiales sin inferir decisiones de producto"
      strategy: "wrap"

    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Planifica alcance completo y genera auxiliares solo cuando aportan"
      strategy: "wrap"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Deriva trabajo completo según dependencias e integración"
      strategy: "wrap"

    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Comprueba doctrina, cobertura y trazabilidad sin modificar artefactos"
      strategy: "wrap"

    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Implementa sin alterar alcance ni confundir avance con aceptación"
      strategy: "wrap"

    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Cierra únicamente brechas del alcance aprobado"
      strategy: "wrap"

tags:
  - "human-centered"
  - "jobs-to-be-done"
  - "job-stories"
  - "product-governance"
  - "sdd"
